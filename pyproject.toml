[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokencount"
version = "0.1.0"
description = "Estimate LLM token counts and cost for files or stdin, offline, with no tokenizer download."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/tokencount"

[project.scripts]
tokencount = "tokencount:main"

[tool.setuptools]
py-modules = ["tokencount"]
